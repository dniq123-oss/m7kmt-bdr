<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nyx</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "SF Pro", system-ui, sans-serif;
    background: #0a0a0a; color: #e8e8e8; min-height: 100vh;
    padding: 16px; display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 480px; }
  .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  h1 { font-size: 20px; font-weight: 600; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #333; transition: all 0.2s;
  }
  .dot.on { background: #4ade80; box-shadow: 0 0 10px #4ade80; }
  .card {
    background: #141414; border: 1px solid #222;
    border-radius: 12px; padding: 14px; margin-bottom: 10px;
  }
  label {
    display: block; font-size: 10px; color: #777;
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.6px;
  }
  input, textarea {
    width: 100%; background: #0a0a0a; border: 1px solid #262626;
    border-radius: 8px; padding: 10px 12px; color: #e8e8e8;
    font-size: 14px; font-family: inherit; margin-bottom: 10px;
  }
  input:focus, textarea:focus { outline: none; border-color: #4a7dff; }
  textarea {
    resize: vertical; min-height: 90px;
    font-family: ui-monospace, monospace; font-size: 11px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: opacity 0.15s;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.35; }
  .start { background: #4ade80; color: #000; margin-bottom: 8px; }
  .stop  { background: #ff3b3b; color: #fff; }
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 10px;
  }
  .stat {
    background: #0a0a0a; border: 1px solid #222;
    border-radius: 8px; padding: 10px; text-align: center;
  }
  .stat .v {
    font-size: 18px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat .l { font-size: 9px; color: #666; margin-top: 2px; }
  .stat.ok .v  { color: #4ade80; }
  .stat.err .v { color: #ff3b3b; }
  .accs {
    background: #0a0a0a; border: 1px solid #222;
    border-radius: 8px; padding: 10px; font-size: 11px;
    max-height: 160px; overflow-y: auto;
  }
  .acc {
    padding: 6px 0; border-bottom: 1px solid #1a1a1a;
    display: flex; justify-content: space-between;
    font-family: ui-monospace, monospace;
  }
  .acc:last-child { border: none; }
  .acc .name { color: #666; }
  .acc .num  { color: #4ade80; }
  .acc .num.bad { color: #ff3b3b; }
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: #1e1e1e; border: 1px solid #2a2a2a;
    padding: 10px 18px; border-radius: 8px; font-size: 13px;
    transition: transform 0.25s; pointer-events: none; z-index: 99;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: #ff3b3b; color: #ff5555; }
  .toast.ok  { border-color: #4ade80; color: #4ade80; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>nyx</h1>
    <div class="dot" id="dot"></div>
  </div>

  <!-- server -->
  <div class="card">
    <label>server</label>
    <input id="api" placeholder="https://your-app.onrender.com" style="margin-bottom:0" />
  </div>

  <!-- target -->
  <div class="card">
    <label>رابط البث</label>
    <input id="room" placeholder="https://www.tiktok.com/@user/live" />
    <label>الرسالة</label>
    <input id="msg" placeholder="نص الرسالة" value="nyx" style="margin-bottom:0" />
  </div>

  <!-- settings -->
  <div class="card">
    <div class="row2">
      <div>
        <label>threads / حساب</label>
        <input id="threads" type="number" value="1" min="1" style="margin-bottom:0" />
      </div>
      <div>
        <label>interval (ث)</label>
        <input id="interval" type="number" value="0.3" step="0.1" min="0.1" style="margin-bottom:0" />
      </div>
    </div>
  </div>

  <!-- accounts -->
  <div class="card">
    <label>الحسابات — كل سطر: cookie|csrf</label>
    <textarea id="accs" placeholder="sessionid=...; tt-target-idc=...; ttwid=...; msToken=...|csrf
sessionid=...; tt-target-idc=...; ttwid=...; msToken=...|csrf"></textarea>
  </div>

  <!-- controls -->
  <div class="card">
    <div class="stats">
      <div class="stat"><div class="v" id="s-sent">0</div><div class="l">مرسل</div></div>
      <div class="stat ok"><div class="v" id="s-ok">0</div><div class="l">نجح</div></div>
      <div class="stat err"><div class="v" id="s-err">0</div><div class="l">فشل</div></div>
    </div>
    <button class="start" id="b-start" onclick="start()">تشغيل</button>
    <button class="stop"  id="b-stop"  onclick="stop()" disabled>إيقاف</button>
  </div>

  <!-- live accounts -->
  <div class="card" id="accs-card" style="display:none">
    <label>الحسابات النشطة</label>
    <div class="accs" id="accs-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let api = localStorage.getItem("nyx_api") || "";
$("api").value = api;

function saveApi() {
  api = $("api").value.replace(/\/+$/, "");
  localStorage.setItem("nyx_api", api);
}

function toast(m, t = "ok") {
  const el = $("toast");
  el.textContent = m;
  el.className = "toast show " + t;
  clearTimeout(el._h);
  el._h = setTimeout(() => el.className = "toast " + t, 2400);
}

async function req(path, opts = {}) {
  saveApi();
  if (!api) throw new Error("حط عنوان السيرفر");
  const r = await fetch(api + path, opts);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function readAccounts() {
  return $("accs").value
    .split("\n")
    .filter(l => l.trim())
    .map(l => {
      const [c, s] = l.split("|");
      return { cookie: (c || "").trim(), csrf: (s || "").trim() };
    })
    .filter(a => a.cookie);
}

async function start() {
  const payload = {
    room:     $("room").value.trim(),
    msg:      $("msg").value.trim(),
    threads:  parseInt($("threads").value) || 1,
    interval: parseFloat($("interval").value) || 0.3,
    accounts: readAccounts(),
  };
  if (!payload.room)             return toast("حط رابط البث", "err");
  if (!payload.msg)              return toast("حط الرسالة", "err");
  if (!payload.accounts.length)  return toast("حط حساب واحد على الأقل", "err");

  $("b-start").disabled = true;
  toast("جاري استخراج room id...");

  try {
    const j = await req("/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (j.ok) {
      toast(`اشتغل — ${j.workers} worker / ${j.accounts} حساب`);
      $("b-stop").disabled = false;
    } else {
      toast(j.error || "فشل", "err");
      $("b-start").disabled = false;
    }
  } catch (e) {
    toast(e.message, "err");
    $("b-start").disabled = false;
  }
  refresh();
}

async function stop() {
  try {
    await req("/stop", { method: "POST" });
    toast("تم الإيقاف");
    $("b-start").disabled = false;
    $("b-stop").disabled = true;
  } catch (e) { toast(e.message, "err"); }
  refresh();
}

async function refresh() {
  if (!api) {
    $("dot").className = "dot";
    return;
  }
  try {
    const s = await req("/status");
    $("dot").className = "dot " + (s.running ? "on" : "");
    $("s-sent").textContent = s.totals.sent;
    $("s-ok").textContent   = s.totals.ok;
    $("s-err").textContent  = s.totals.err;
    $("b-start").disabled = s.running;
    $("b-stop").disabled  = !s.running;

    if (s.accounts && s.accounts.length) {
      $("accs-card").style.display = "block";
      $("accs-list").innerHTML = s.accounts.map((a, i) => `
        <div class="acc">
          <span class="name">#${i+1} ${a.cookie}</span>
          <span class="num ${a.err > a.ok ? 'bad' : ''}">${a.ok}/${a.sent}</span>
        </div>
      `).join("");
    }
  } catch (e) {
    $("dot").className = "dot";
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
